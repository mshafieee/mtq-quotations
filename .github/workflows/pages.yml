name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/friendly-fermi-dvhtnu]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The app is a single page plus its brand assets, and the static
      # contract sample that gets sent to clients; contract.txt is a
      # reference template that does not belong on the served site.
      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html contract-preview.html _site/
          cp -r assets _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
