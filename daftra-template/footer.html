<style type="text/css">
    * { box-sizing: border-box; }
    .mto-sticky-footer {
        width: 100%;
        height: 34px;
        margin: 0;
        padding: 0;
        background-color: #01040B !important;
        color: #ffffff !important;
        direction: rtl;
        font-family: "Avenir Next", Tahoma, Arial, sans-serif;
        font-size: 10px;
        font-weight: bold;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }
    .mto-sticky-footer table {
        width: 100%;
        height: 34px;
        margin: 0;
        padding: 0;
        border: 0;
        border-collapse: collapse;
        table-layout: fixed;
        background-color: #01040B !important;
    }
    .mto-sticky-footer td {
        height: 34px;
        padding: 0 14px;
        border: 0;
        background-color: #01040B !important;
        color: #ffffff !important;
        vertical-align: middle;
        white-space: nowrap;
    }
    .mto-footer-company { width: 55%; text-align: right; }
    .mto-footer-phone   { width: 45%; direction: ltr; text-align: left; }
    /* Both parts are inline-blocks so the bidi algorithm sees two neutral objects and leaves
       them in source order. As plain inline text the digits join the Arabic run beside them
       and get reordered, which printed the phone to the left of الإدارة instead of its right;
       unicode-bidi: embed does not help, since the embedding still nests inside that run. */
    .mto-footer-phone .mto-dept {
        display: inline-block;
        margin-left: 6px;
        direction: rtl;
        vertical-align: middle;
    }
    .mto-footer-phone #footer_phone { display: inline-block; direction: ltr; vertical-align: middle; }
    .mto-sq {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 2px;
        background-color: #7B27FF !important;
        vertical-align: middle;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }
    .mto-footer-company .mto-sq { margin-right: 0; margin-left: 7px; }
    .mto-footer-phone .mto-sq { margin-right: 7px; margin-left: 0; }
</style>

<div class="mto-sticky-footer">
    <table border="0" cellspacing="0" cellpadding="0">
        <tr>
            <td class="mto-footer-company"><span class="mto-sq"></span><span id="footer_company" class="editable-area">شركة متقنون تك للتجارة</span></td>
            <td class="mto-footer-phone"><span class="mto-sq"></span><span id="footer_phone" class="editable-area">+966 53 279 9924</span><span id="footer_dept" class="mto-dept editable-area">الإدارة</span></td>
        </tr>
    </table>
</div>
